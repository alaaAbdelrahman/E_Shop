services:
  eshopdb:
    image: postgres:17
    volumes:
      - postgres_eshopdb:/var/lib/postgresql/data

  distributedcache:
    image: redis

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: "YourStrongPassword123!"
    ports:
      - "5341:80"

  messagebus:
    image: rabbitmq:management
    ports:
      - "15672:15672"
      - "5672:5672"
  identity:
    image: quay.io/keycloak/keycloak:24.0.3

volumes:
  postgres_eshopdb: