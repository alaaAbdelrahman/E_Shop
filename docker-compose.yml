services:
  eshopdb:
    image: postgres:17
    volumes:
      - postgres_eshopdb:/var/lib/postgresql/data

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: "YourStrongPassword123!"
    ports:
      - "5341:80"

volumes:
  postgres_eshopdb: